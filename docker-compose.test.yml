services:
  postgres-test:
    image: postgres:15-alpine
    container_name: nonoka_postgres_test
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: nonoka_im_test
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nonoka_im_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  openfga-postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga_test
      POSTGRES_DB: openfga_test
    volumes:
      - openfga_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  openfga-migrate-test:
    image: openfga/openfga:v1.8.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga_test@openfga-postgres-test:5432/openfga_test?sslmode=disable
    depends_on:
      openfga-postgres-test:
        condition: service_healthy

  openfga-test:
    image: openfga/openfga:v1.8.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga_test@openfga-postgres-test:5432/openfga_test?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_AUTHN_METHOD: preshared
      # Must match testOpenFGADefaultToken in test/integration/setup_test.go
      # and OPENFGA_API_TOKEN exported by the integration test runner.
      OPENFGA_AUTHN_PRESHARED_KEYS: nonoka-openfga-test-key
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      openfga-migrate-test:
        condition: service_completed_successfully

  redis-test:
    image: redis:7-alpine
    container_name: nonoka_redis_test
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  mongodb-test:
    image: mongo:7
    container_name: nonoka_mongodb_test
    ports:
      - "127.0.0.1:27018:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - mongodbdata_test:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  meilisearch-test:
    image: getmeili/meilisearch:v1.12.0
    container_name: nonoka_meilisearch_test
    environment:
      MEILI_MASTER_KEY: nonoka-search-test-key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearchdata_test:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Single-node KRaft kafka: topic creation and deletion propagate in
  # milliseconds (no zookeeper), which the integration tests rely on heavily
  # -- they recreate topics constantly and produce immediately afterwards.
  kafka-test:
    image: apache/kafka:3.8.1
    container_name: nonoka_kafka_test
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_test:
  openfga_pgdata_test:
  redisdata_test:
  mongodbdata_test:
  meilisearchdata_test:
