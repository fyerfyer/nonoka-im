                                $ref: '#/components/schemas/api.im.v1.ListGroupsReply'
        post:
            tags:
                - GroupService
            description: CreateGroup creates a new group and adds the creator plus optional members.
            operationId: GroupService_CreateGroup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.im.v1.CreateGroupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.im.v1.CreateGroupReply'
    /v1/groups/{groupId}:
        get:
            tags:
                - GroupService
            description: GetGroup returns details of a specific group.
            operationId: GroupService_GetGroup
            parameters:
                - name: groupId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.im.v1.Group'
    /v1/groups/{groupId}/members:
        get:
            tags:
                - GroupService
            description: ListGroupMembers returns the members of a group.
            operationId: GroupService_ListGroupMembers
            parameters:
                - name: groupId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.im.v1.ListGroupMembersReply'
        post:
            tags:
                - GroupService
            description: AddGroupMember adds a user to a group.
            operationId: GroupService_AddGroupMember
            parameters:
                - name: groupId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.im.v1.AddGroupMemberRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/groups/{groupId}/members/{userId}:
        delete:
            tags:
                - GroupService
            description: RemoveGroupMember removes a user from a group.
            operationId: GroupService_RemoveGroupMember
            parameters:
                - name: groupId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/message/pull:
        get:
            tags:
                - MessageService
            operationId: MessageService_PullMessages
            parameters:
                - name: topic
                  in: query
                  schema:
                    type: string
                - name: lastSeq
                  in: query
                  schema:
                    type: string
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: endSeq
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.im.v1.PullReply'
    /v1/message/search:
        get:
            tags:
                - MessageService
            description: |-
                SearchMessages performs keyword search inside one conversation. Search is
                 optional: deployments without a search backend return SEARCH_UNAVAILABLE.
            operationId: MessageService_SearchMessages
            parameters:
                - name: topic
                  in: query
                  schema:
                    type: string
                - name: query
                  in: query
                  schema:
                    type: string
                - name: senderId
                  in: query
                  schema:
                    type: string
                - name: since
                  in: query
                  schema:
                    type: string
                - name: until
                  in: query
                  schema:
                    type: string
                - name: hasFile
                  in: query
                  schema:
                    type: boolean
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: offset
                  in: query
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.im.v1.SearchMessagesReply'
    /v1/message/send:
        post:
            tags:
                - MessageService
            operationId: MessageService_SendMessage
            requestBody:
