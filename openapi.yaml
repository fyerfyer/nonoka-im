        api.im.v1.ListConversationsReply:
            type: object
            properties:
                conversations:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.Conversation'
                hasMore:
                    type: boolean
        api.im.v1.ListGroupMembersReply:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.GroupMember'
        api.im.v1.ListGroupsReply:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.Group'
        api.im.v1.LoginReply:
            type: object
            properties:
                userId:
                    type: string
                token:
                    type: string
                refreshToken:
                    type: string
                    description: |-
                        Opaque refresh token (not a JWT). Store it securely and present it to
                         RefreshToken to obtain a new access/refresh token pair.
        api.im.v1.LoginRequest:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                deviceId:
                    type: string
                    description: Reserved for future use
        api.im.v1.LogoutReply:
            type: object
            properties:
                success:
                    type: boolean
        api.im.v1.LogoutRequest:
            type: object
            properties: {}
        api.im.v1.MarkConversationReadRequest:
            type: object
            properties:
                topic:
                    type: string
        api.im.v1.PullMessage:
            type: object
            properties:
                msgId:
                    type: string
                topic:
                    type: string
                senderId:
                    type: string
                msgType:
                    type: integer
                    format: int32
                content:
                    type: string
                    format: bytes
                timestamp:
                    type: string
                topicSeq:
                    type: string
                clientMsgId:
                    type: string
                recalled:
                    type: boolean
            description: PullMessage is a message in the pull response.
        api.im.v1.PullReply:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.PullMessage'
                hasMore:
                    type: boolean
                nextSeq:
                    type: string
                    description: |-
                        Forward mode: next seq to pull from (> last returned seq).
                         Backward mode: oldest returned seq, suitable as the next end_seq.
            description: PullReply is sent by server in response to PullRequest.
        api.im.v1.RefreshTokenRequest:
            type: object
            properties:
                userId:
                    type: string
                deviceId:
                    type: string
                refreshToken:
                    type: string
        api.im.v1.RegisterReply:
            type: object
            properties:
                userId:
                    type: string
        api.im.v1.RegisterRequest:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
        api.im.v1.SearchMessage:
            type: object
            properties:
                msgId:
                    type: string
                topic:
                    type: string
                topicSeq:
                    type: string
                senderId:
                    type: string
                timestamp:
                    type: string
                msgType:
                    type: integer
                    format: int32
                hasFile:
                    type: boolean
                snippet:
                    type: string
            description: SearchMessage is one authorized search hit.
        api.im.v1.SearchMessagesReply:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.SearchMessage'
