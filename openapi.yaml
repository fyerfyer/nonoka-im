                    type: string
        api.im.v1.SearchMessage:
            type: object
            properties:
                msgId:
                    type: string
                topic:
                    type: string
                topicSeq:
                    type: string
                senderId:
                    type: string
                timestamp:
                    type: string
                msgType:
                    type: integer
                    format: int32
                hasFile:
                    type: boolean
                snippet:
                    type: string
            description: SearchMessage is one authorized search hit.
        api.im.v1.SearchMessagesReply:
            type: object
