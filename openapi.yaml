                createdAt:
                    type: string
        api.im.v1.GroupMember:
            type: object
            properties:
                userId:
                    type: string
                username:
                    type: string
        api.im.v1.ListConversationsReply:
            type: object
            properties:
                conversations:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.Conversation'
                hasMore:
                    type: boolean
        api.im.v1.ListGroupMembersReply:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.GroupMember'
        api.im.v1.ListGroupsReply:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.Group'
        api.im.v1.LoginReply:
            type: object
            properties:
                userId:
                    type: string
                token:
                    type: string
                refreshToken:
                    type: string
                    description: |-
                        Opaque refresh token (not a JWT). Store it securely and present it to
                         RefreshToken to obtain a new access/refresh token pair.
        api.im.v1.LoginRequest:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                deviceId:
                    type: string
