tags:
    - name: AgentRunService
      description: |-
        AgentRunService is the runtime/observability surface for agent runs and
         approvals. Configuration remains on the management API until its own proto
         migration lands.
    - name: AgentService
      description: AgentService is the owner/editor-facing Agent configuration API.
    - name: AuthService
    - name: BotService
      description: |-
        BotService is the owner-facing management API for external bots. The
         runtime protocol under /v1/bot/* is intentionally separate: it uses bot
         tokens and Standard Webhooks semantics rather than a user JWT.
    - name: ConversationService
    - name: DispatchService
    - name: GroupService
      description: GroupService manages group conversations and memberships.
    - name: MessageService
    - name: UserService
