                    type: boolean
        api.im.v1.SearchUsersReply:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.User'
        api.im.v1.SendMessageReply:
            type: object
            properties:
                clientMsgId:
                    type: string
                msgId:
                    type: string
                timestamp:
                    type: string
                topicSeq:
                    type: string
            description: ACK
        api.im.v1.SendMessageRequest:
            type: object
            properties:
                topic:
                    type: string
                msgType:
                    type: integer
                    format: enum
                content:
                    type: string
                    format: bytes
                clientMsgId:
                    type: string
                mentionedUserIds:
                    type: array
                    items:
                        type: string
            description: Client-to-server request
        api.im.v1.User:
            type: object
