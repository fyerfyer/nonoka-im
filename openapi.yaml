        api.im.v1.MarkConversationReadRequest:
            type: object
            properties:
                topic:
                    type: string
        api.im.v1.PullMessage:
            type: object
            properties:
                msgId:
                    type: string
                topic:
                    type: string
                senderId:
                    type: string
                msgType:
                    type: integer
                    format: int32
                content:
                    type: string
                    format: bytes
                timestamp:
                    type: string
                topicSeq:
                    type: string
                clientMsgId:
                    type: string
                recalled:
                    type: boolean
            description: PullMessage is a message in the pull response.
        api.im.v1.PullReply:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.im.v1.PullMessage'
                hasMore:
                    type: boolean
                nextSeq:
                    type: string
                    description: |-
                        Forward mode: next seq to pull from (> last returned seq).
                         Backward mode: oldest returned seq, suitable as the next end_seq.
            description: PullReply is sent by server in response to PullRequest.
        api.im.v1.RefreshTokenRequest:
            type: object
            properties:
                userId:
                    type: string
