name: backend
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Start test dependencies
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 300
      - run: go vet ./...
      - run: go test ./test/architecture/... -count=1
      # The integration, agent and data packages share one PostgreSQL test
      # database. Running packages in parallel truncates tables under each
      # other and produces spurious deadlocks.
      - run: go test -p 1 ./... -count=1 -timeout 20m
      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
