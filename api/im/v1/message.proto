syntax = "proto3";

package api.im.v1;

import "google/api/annotations.proto";

option go_package = "nonoka-im/api/im/v1;v1";

service MessageService {
  rpc SendMessage (SendMessageRequest) returns (SendMessageReply) {
    option (google.api.http) = {
      post: "/v1/message/send"
      body: "*"
    };
  }

  rpc PullMessages (PullRequest) returns (PullReply) {
    option (google.api.http) = {
      get: "/v1/message/pull"
    };
  }
}

enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  MSG_TYPE_TEXT = 1;
  MSG_TYPE_IMAGE = 2;
  MSG_TYPE_FILE = 3;
  MSG_TYPE_VOICE = 4;
}

// Client-to-server request
message SendMessageRequest {
  string topic = 1;
  MsgType msg_type = 2;
  bytes content = 3;
  string client_msg_id = 4;
  repeated int64 mentioned_user_ids = 5; // for group @mentions
}

// ACK
message SendMessageReply {
  string client_msg_id = 1;
  int64 msg_id = 2;
  int64 timestamp = 3;
  uint64 topic_seq = 4;
}

// Push
message MessagePush {
  int64 msg_id = 1;
  string topic = 2;
  int64 sender_id = 3;
  int32 msg_type = 4;
  bytes content = 5;
  int64 timestamp = 6;
  uint64 topic_seq = 7;
  string client_msg_id = 8;
  bool recalled = 9;
  repeated int64 mentioned_user_ids = 10; // @mentioned users, for highlight/badge on the client
}

// UpstreamMessage is sent from the Gateway to Kafka.
// MsgWorker consumes these messages to persist and dispatch them.
message UpstreamMessage {
  int64 sender_id = 1;
  string topic = 2;
  int32 msg_type = 3;
  bytes content = 4;
  string client_msg_id = 5;
  int64 timestamp = 6;
  repeated int64 mentioned_user_ids = 7; // for group @mentions
}

// PullRequest is sent by client to pull messages.
//
// Two mutually exclusive modes:
//   - Forward (incremental): last_seq > 0, end_seq == 0. Returns messages
//     with seq > last_seq in ascending order (offline catch-up).
//   - Backward (history): end_seq > 0, or both zero. Returns the latest
//     messages with seq < end_seq (or the latest overall when end_seq == 0)
//     in ascending order, for paging history backwards. Use the oldest
//     returned topic_seq as the next end_seq.
message PullRequest {
  string topic = 1;
  uint64 last_seq = 2; // client last known seq, fetch messages with seq > last_seq
  int32 limit = 3;
  uint64 end_seq = 4; // exclusive upper bound; 0 = from the latest (backward history page)
}

// PullMessage is a message in the pull response.
message PullMessage {
  int64 msg_id = 1;
  string topic = 2;
  int64 sender_id = 3;
  int32 msg_type = 4;
  bytes content = 5;
  int64 timestamp = 6;
  uint64 topic_seq = 7;
  string client_msg_id = 8;
  bool recalled = 9;
}

// PullReply is sent by server in response to PullRequest.
message PullReply {
  repeated PullMessage messages = 1;
  bool has_more = 2;
  // Forward mode: next seq to pull from (> last returned seq).
  // Backward mode: oldest returned seq, suitable as the next end_seq.
  uint64 next_seq = 3;
}
