syntax = "proto3";

package api.im.v1;

import "im/v1/message.proto";

option go_package = "nonoka-im/api/im/v1;v1";

enum Command {
  CMD_UNKNOWN = 0;
  CMD_HEARTBEAT = 1;
  CMD_AUTH = 2;
  CMD_PUBLISH = 3;     // client -> server: send message
  CMD_ACK = 4;         // bi-directional: message ack
  CMD_PULL = 5;        // client -> server: pull offline messages
  CMD_NOTIFY = 6;      // server -> client: push notification
  CMD_READ_RECEIPT = 7;     // bi-directional: read receipt
  CMD_DELIVERY_RECEIPT = 8; // server -> client: delivery receipt
  CMD_SEND_RECEIPT = 9;     // server -> client: send receipt (msg_id/topic_seq confirmation)
  CMD_RECALL = 10;          // bi-directional: recall a message
  CMD_AGENT_RUN_EVENT = 11; // server -> client: transient agent run stream event
  CMD_BOT_STREAM_EVENT = 12; // server -> client: transient external-bot reply stream event
}

// AgentRunEventType is the closed set of transient run stream events.
enum AgentRunEventType {
  AGENT_RUN_EVENT_UNKNOWN = 0;
  AGENT_RUN_STARTED = 1;
  AGENT_RUN_DELTA = 2;
  AGENT_RUN_TOOL_STARTED = 3;
  AGENT_RUN_TOOL_FINISHED = 4;
  AGENT_RUN_APPROVAL_REQUIRED = 5;
  AGENT_RUN_APPROVAL_RESOLVED = 6;
  AGENT_RUN_COMPLETED = 7;
  AGENT_RUN_FAILED = 8;
  AGENT_RUN_CANCELLED = 9;
  AGENT_RUN_HEARTBEAT = 10;
}

// AgentRunCitation is one message source consulted by an agent run.
message AgentRunCitation {
  int64 msg_id = 1;
  string topic = 2;
  uint64 topic_seq = 3;
  int64 sender_id = 4;
  string snippet = 5;
}

// AgentRunEvent is a transient progress event for one agent run. It is never
// persisted as an IM message; the final answer still arrives through the normal
// message pipeline. (run_id, seq) is the ordering and deduplication key.
message AgentRunEvent {
  uint64 run_id = 1;
  uint64 seq = 2;
  AgentRunEventType type = 3;
  string topic = 4;
  int64 agent_id = 5;
  int64 bot_user_id = 6;
  int64 actor_user_id = 7;
  int64 trigger_msg_id = 8;
  reserved 9;
  reserved "test";
  string delta = 10;
  string tool = 11;
  string tool_call_id = 12;
  string summary = 13;
  string status = 14;
  uint64 approval_id = 15;
  int64 reply_msg_id = 16;
  string error_code = 17;
  string error_class = 18;
  bool retryable = 19;
  int32 input_tokens = 20;
  int32 output_tokens = 21;
  int64 timestamp_ms = 22;
  string client_msg_id = 23;
  string error_message = 24;
  int64 retry_after_at_ms = 25;
  repeated AgentRunCitation citations = 26;
}

// BotStreamEvent is a transient progress event for one external-bot reply
// stream. Deltas are never persisted; the final answer arrives as a normal IM
// message keyed by client_msg_id. (stream_id, seq) is the ordering key.
enum BotStreamEventType {
  BOT_STREAM_EVENT_UNKNOWN = 0;
  BOT_STREAM_STARTED = 1;
  BOT_STREAM_DELTA = 2;
  BOT_STREAM_FINAL = 3;
  BOT_STREAM_ABORTED = 4;
}

message BotStreamEvent {
  string stream_id = 1;
  uint64 seq = 2;
  BotStreamEventType type = 3;
  string topic = 4;
  int64 bot_id = 5;
  int64 bot_user_id = 6;
  string delta = 7;
  string client_msg_id = 8;
  int64 reply_msg_id = 9;
  int64 timestamp_ms = 10;
}

// Packet is the unified wire format for all WebSocket messages.
// The payload is self-describing via oneof — clients no longer need to
// guess the serialization format for each command.
message Packet {
  Command cmd = 1;
  uint64 seq = 2;

  // Typed payload — exactly one field is set per packet.
  oneof payload {
    // CMD_AUTH
    AuthRequest  auth_req  = 10;
    AuthResponse auth_resp = 11;

    // CMD_PUBLISH
    SendMessageRequest send_req   = 20;
    SendMessageReply   send_reply = 21;

    // CMD_PULL
    PullRequest pull_req   = 30;
    PullReply   pull_reply = 31;

    // CMD_ACK
    AckRequest ack_req = 40;

    // CMD_NOTIFY
    MessagePush notify = 50;

    // CMD_READ_RECEIPT
    ReadReceipt read_receipt = 60;

    // CMD_DELIVERY_RECEIPT
    DeliveryReceipt delivery_receipt = 70;

    // CMD_SEND_RECEIPT
    SendReceipt send_receipt = 80;
    RecallRequest recall_req = 90;
    RecallNotice recall_notice = 100;
    AgentRunEvent agent_run_event = 110;
    BotStreamEvent bot_stream_event = 111;

    // Unified error response (can be returned for any command).
    ErrorResponse error = 99;
  }
}

// AuthRequest is sent by the client to authenticate the WebSocket connection.
message AuthRequest {
  string token     = 1;
  string device_id = 2;
}

// AuthResponse is returned by the server after successful authentication.
message AuthResponse {
  bool   success = 1;
  int64  user_id = 2;
  string device_id = 3;
}

// AckRequest is sent by the client to acknowledge receipt of a pushed message.
message AckRequest {
  int64  msg_id    = 1; // confirmed message ID
  string topic     = 2; // topic the message belongs to
  uint64 topic_seq = 3; // sequence number being acknowledged
}

// ErrorResponse is the unified error format returned by the server.
message ErrorResponse {
  int32  code          = 1; // business error code
  string message       = 2; // human-readable description
  bool   retryable     = 3; // whether the client should retry
  uint64 retry_after_ms = 4; // suggested retry delay in milliseconds
}

// ReadReceipt is sent by the client to mark messages as read,
// and pushed by the server to notify the sender.
message ReadReceipt {
  string topic     = 1;
  uint64 up_to_seq = 2;   // messages with seq <= up_to_seq are marked as read
  int64  reader_id = 3;   // who read the messages
}

// DeliveryReceipt is pushed by the server to notify the sender
// that the recipient has received the message.
message DeliveryReceipt {
  string topic     = 1;
  uint64 topic_seq = 2;
  int64  msg_id    = 3;
}

// SendReceipt is pushed by the server to confirm that a message sent by
// the client has been persisted and assigned a msg_id and topic_seq.
message SendReceipt {
  string client_msg_id = 1; // the client_msg_id from the original SendMessageRequest
  int64  msg_id        = 2; // the globally unique message ID assigned by the server
  string topic         = 3; // the topic the message was sent to
  uint64 topic_seq     = 4; // the sequence number within the topic
  int64  timestamp     = 5; // server processing timestamp
}

message RecallRequest {
  string topic = 1;
  uint64 topic_seq = 2;
  int64 msg_id = 3;
}

message RecallNotice {
  string topic = 1;
  uint64 topic_seq = 2;
  int64 msg_id = 3;
  int64 sender_id = 4;
  int64 recalled_at = 5;
}
