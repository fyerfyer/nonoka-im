syntax = "proto3";

package api.im.v1;

import "google/api/annotations.proto";

option go_package = "nonoka-im/api/im/v1;v1";

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterReply) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterReply {
  int64 user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // Reserved for future use
  string device_id = 3;
}

message LoginReply {
  int64 user_id = 1;
  string token = 2;
}