syntax = "proto3";
package kratos.api;

option go_package = "nonoka-im/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Dispatch dispatch = 4;
  GatewayConfig gateway = 5;
  MsgworkerConfig msgworker = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    int32 max_open_conns = 3;
    int32 max_idle_conns = 4;
    google.protobuf.Duration conn_max_lifetime = 5;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message MongoDB {
    string uri = 1;
    string database = 2;
    // write_concern controls MongoDB durability/latency trade-off.
    // "w1" = w=1, j=false (fast, default for IM messages).
    // "majority" = w=majority, j=true (durable, slower).
    // "majority_jfalse" = w=majority, j=false (balanced).
    string write_concern = 3;
  }
  message Kafka {
    repeated string brokers = 1;
    string topic = 2;
    string consumer_group = 3;

    // Producer settings
    int32 batch_size = 4;
    google.protobuf.Duration batch_timeout = 5;
    string compression = 6;            // "none" | "gzip" | "snappy" | "lz4" | "zstd"
    string required_acks = 7;          // "none" | "one" | "all"
    bool async = 8;                    // true = async producer (higher throughput, lower durability)
    int32 max_attempts = 9;
    google.protobuf.Duration write_timeout = 10;
    google.protobuf.Duration read_timeout = 11;

    // Consumer settings
    int32 worker_count = 12;
    int32 min_bytes = 13;
    int32 max_bytes = 14;
    google.protobuf.Duration max_wait = 15;
    google.protobuf.Duration commit_interval = 16;  // 0 = manual commit (stronger consistency)
    int32 max_retries = 17;            // local retry count before DLQ; 0 = DLQ immediately
    int64 start_offset = 18;           // -1 = first offset, -2 = last offset (kafka-go constants)
    int32 commit_batch_size = 19;      // number of messages to batch before committing offsets
    google.protobuf.Duration commit_flush_interval = 20; // max interval between offset commits
    int32 partitions = 21; // expected topic partition count
    string dlq_topic = 22; // optional explicit dead-letter topic name
  }
  Database database = 1;
  Redis redis = 2;
  MongoDB mongodb = 3;
  Kafka kafka = 4;
}

message Auth {
  string jwt_secret = 1;
  // Access token TTL. Keep this short (e.g., 24h) and pair it with
  // refresh_token_ttl so clients can rotate tokens without re-login.
  google.protobuf.Duration token_ttl = 2;
  // Refresh token TTL (e.g., 720h/30d). Refresh tokens are opaque random
  // strings stored hashed in Redis and rotated on every use.
  google.protobuf.Duration refresh_token_ttl = 3;
  // bcrypt cost for password hashing; 0 means bcrypt.DefaultCost (10).
  // Test environments can lower this (e.g., 4) to cut CPU load.
  int32 bcrypt_cost = 4;
}

message GatewayNode {
  string node_id = 1;
  string gateway_url = 2;
  string gateway_grpc_addr = 3;
}

message GatewayConfig {
  // WebSocket heartbeat interval (e.g., 30s). This controls how often
  // the server expects heartbeats from connected clients.
  google.protobuf.Duration heartbeat_interval = 1;
  // WebSocket heartbeat timeout (e.g., 90s). If no heartbeat is received
  // within this duration, the server will close the connection.
  google.protobuf.Duration heartbeat_timeout = 2;
  // WebSocket read timeout (e.g., 60s). Sets the read deadline on the
  // underlying WebSocket connection.
  google.protobuf.Duration read_timeout = 3;
  // WebSocket write timeout (e.g., 10s). Sets the write deadline on the
  // underlying WebSocket connection. A slow client will be closed after this.
  google.protobuf.Duration write_timeout = 4;
  // Allowed WebSocket origins. If empty, all origins are allowed (development
  // default). In production, set this to the exact origins that may connect.
  repeated string allowed_origins = 5;
  // CORS allowed origins for HTTP endpoints. If empty, CORS is disabled.
  repeated string cors_origins = 6;
  google.protobuf.Duration recall_window = 7; // maximum age for message recall
  // Per-connection WebSocket message rate limit (token bucket). Limits the
  // publish rate of a single connection without disconnecting it; excess
  // publishes are rejected with an error packet. Zero/unset uses the
  // server-side default (10 msg/s, burst 20).
  RateLimit msg_rate_limit = 8;
}

// RateLimit is a token-bucket rate limit definition.
message RateLimit {
  // Sustained messages per second allowed per connection.
  double msg_per_sec = 1;
  // Burst size: maximum number of messages allowed in a short burst.
  int32 burst = 2;
}

message Dispatch {
  repeated GatewayNode gateways = 1;
  string strategy = 2; // "consistent_hash" | "least_connections"
  google.protobuf.Duration heartbeat_interval = 3;
  google.protobuf.Duration node_ttl = 4;
}

message Gateway {
  string node_id = 1;
  string gateway_url = 2;
}

message MsgworkerConfig {
  // Local session route cache TTL. 0 means use default (5s).
  google.protobuf.Duration session_cache_ttl = 1;
  // Max number of pending receipts per user before flush.
  int32 receipt_batch_size = 2;
  // Max time to wait before flushing receipt batch.
  google.protobuf.Duration receipt_batch_timeout = 3;
  // Max number of group messages to batch before MongoDB insert.
  int32 group_batch_size = 4;
  // Max time to wait before flushing group message batch.
  google.protobuf.Duration group_batch_timeout = 5;
}
