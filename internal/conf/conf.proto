syntax = "proto3";
package kratos.api;

option go_package = "nonoka-im/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Dispatch dispatch = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message MongoDB {
    string uri = 1;
    string database = 2;
  }
  message Kafka {
    repeated string brokers = 1;
    string topic = 2;
    string consumer_group = 3;
  }
  Database database = 1;
  Redis redis = 2;
  MongoDB mongodb = 3;
  Kafka kafka = 4;
}

message Auth {
  string jwt_secret = 1;
  google.protobuf.Duration token_ttl = 2;
}

message Gateway {
  string node_id = 1;
  string gateway_url = 2;
}

message Dispatch {
  repeated Gateway gateways = 1;
  string strategy = 2; // "consistent_hash" | "least_connections"
  google.protobuf.Duration heartbeat_interval = 3;
  google.protobuf.Duration node_ttl = 4;
}
