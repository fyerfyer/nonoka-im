server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9002
    timeout: 1s
data:
  database:
    driver: postgres
    source: host=postgres user=nonoka password=nonoka dbname=nonoka port=5432 sslmode=disable TimeZone=Asia/Shanghai
    max_open_conns: 200
    max_idle_conns: 50
    conn_max_lifetime: 1800s
  redis:
    addr: redis:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
  mongodb:
    uri: mongodb://mongodb:27017
    database: nonoka_im
    write_concern: w1
  kafka:
    brokers:
    - kafka:19092
    topic: im-messages
    partitions: 3
    dlq_topic: im-messages-dlq
    consumer_group: msgworker-group
    batch_size: 1000
    batch_timeout: 0.01s
    compression: lz4
    required_acks: one
    async: true
    max_attempts: 3
    write_timeout: 10s
    read_timeout: 10s
    worker_count: 0
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 0.05s
    commit_interval: 0s
    max_retries: 3
    commit_batch_size: 20
    commit_flush_interval: 1s
dispatch:
  gateways:
  - node_id: gateway-1
    gateway_url: ws://gateway-1:8000/ws
    gateway_grpc_addr: gateway-1:9002
  - node_id: gateway-2
    gateway_url: ws://gateway-2:8000/ws
    gateway_grpc_addr: gateway-2:9002
  strategy: consistent_hash
  heartbeat_interval: 10s
  node_ttl: 30s
gateway:
  heartbeat_interval: 30s
  heartbeat_timeout: 90s
  read_timeout: 60s
  write_timeout: 10s
  recall_window: 120s
  allowed_origins: []
  cors_origins:
    - "*"
auth:
  jwt_secret: docker-jwt-secret-do-not-use-in-production
  token_ttl: 3600s
msgworker:
  session_cache_ttl: 5s
  receipt_batch_size: 32
  receipt_batch_timeout: 0.01s
  group_batch_size: 16
  group_batch_timeout: 0.005s
