# Agent worker configuration.
#
# Precedence: built-in defaults < this file < environment variables.
# Secrets (JWT secret, seal key, Bifrost virtual key) stay in the environment
# and are never written here.

data:
  database:
    source: "host=127.0.0.1 user=postgres password=root dbname=nonoka_im port=5432 sslmode=disable"
  mongodb:
    uri: "mongodb://127.0.0.1:27017"
    database: "nonoka_im"
  redis:
    addr: "127.0.0.1:6379"
    read_timeout: 0.2s
    write_timeout: 0.2s
  kafka:
    brokers:
      - "127.0.0.1:9092"
    topic: "agent-events"
    consumer_group: "nonoka-agent-worker"
    dlq_topic: "agent-events-dlq"
    worker_count: 4
    max_retries: 2
    max_wait: 10s
    commit_batch_size: 100
    commit_flush_interval: 1s

# Agent Worker pushes transient run events through the Gateway gRPC PushService.
# In containers GATEWAY_GRPC_ADDR overrides this address.
dispatch:
  gateways:
    - node_id: "gateway-0"
      gateway_url: "ws://127.0.0.1:8000/ws"
      gateway_grpc_addr: "127.0.0.1:9002"

agent_worker:
  run_workers: 8
  run_timeout: 120s
  lease: 180s
  heartbeat: 45s
  queued_poll: 1s
  sweep_interval: 30s
  max_attempts: 5
  dispatch_timeout: 10s
  im_http_url: "http://127.0.0.1:8000"
  bootstrap_agent_id: 1
  bootstrap_bot_id: 0
  bootstrap_owner_id: 0
  bootstrap_name: "Nonoka Assistant"
  bootstrap_instruction: "You are the Nonoka IM assistant. Use concise, helpful answers."
  # Bootstrap-only preference for the first Bifrost model. Runtime model access
  # always comes from the curated model_catalog table.
  bootstrap_model: "deepseek/deepseek-flash"

observability:
  health_addr: ":8090"
  metrics_addr: ":8091"
  otlp_traces_endpoint: ""
