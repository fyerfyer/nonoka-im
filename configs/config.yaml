server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    source: host=127.0.0.1 user=postgres password=root dbname=nonoka_im port=5432 sslmode=disable TimeZone=Asia/Shanghai
    max_open_conns: 200
    max_idle_conns: 50
    conn_max_lifetime: 1800s
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
  mongodb:
    uri: mongodb://127.0.0.1:27017
    database: nonoka_im
  kafka:
    brokers:
      - 127.0.0.1:9092
    topic: im-messages
    consumer_group: msgworker-group
    batch_size: 500
    batch_timeout: 0.02s
    compression: lz4
    required_acks: all
    async: false
    max_attempts: 3
    write_timeout: 10s
    read_timeout: 10s
    worker_count: 0
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 0.05s
    commit_interval: 0s
    max_retries: 3
    commit_batch_size: 20
    commit_flush_interval: 1s
dispatch:
  gateways:
    - node_id: "default"
      gateway_url: "ws://127.0.0.1:8000/ws"
      gateway_grpc_addr: "127.0.0.1:9000"
  strategy: "consistent_hash"
  heartbeat_interval: 10s
  node_ttl: 30s
gateway:
  heartbeat_interval: 30s
  heartbeat_timeout: 90s
  read_timeout: 60s
  write_timeout: 10s
  allowed_origins: []
auth:
  jwt_secret: "change-me-in-production-use-random-string"
  token_ttl: 168h
