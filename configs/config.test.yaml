server:
  http:
    addr: 0.0.0.0:18000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:19000
    timeout: 1s
data:
  database:
    driver: postgres
    source: host=127.0.0.1 user=postgres password=root dbname=nonoka_im_test port=5433 sslmode=disable TimeZone=Asia/Shanghai
  redis:
    addr: 127.0.0.1:6380
    read_timeout: 0.2s
    write_timeout: 0.2s
  mongodb:
    uri: mongodb://127.0.0.1:27018
    database: nonoka_im_test
  kafka:
    brokers:
      - 127.0.0.1:9092
    topic: im-messages
    consumer_group: msgworker-group
    batch_size: 100
    batch_timeout: 100ms
    compression: lz4
    required_acks: all
    async: false
    max_attempts: 3
    write_timeout: 10s
    read_timeout: 10s
    worker_count: 0
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 500ms
    commit_interval: 0s
    max_retries: 3
dispatch:
  gateways:
    - node_id: "default"
      gateway_url: "ws://127.0.0.1:18000/ws"
  strategy: "consistent_hash"
  heartbeat_interval: 10s
  node_ttl: 30s
gateway:
  heartbeat_interval: 30s
  heartbeat_timeout: 90s
  read_timeout: 60s
auth:
  jwt_secret: "test-jwt-secret-do-not-use-in-production"
  token_ttl: 3600s