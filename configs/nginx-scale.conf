# Nginx entry point for multi-gateway Nonoka-IM deployments.
#
# This configuration exposes a single public endpoint that load-balances
# across multiple gateway instances. WebSocket connections are kept sticky
# (ip_hash) so a given client always lands on the same gateway node. HTTP
# API requests are load-balanced with least-connections to spread CPU cost.
#
# The gateway upstream uses Docker Compose service names by default. Override
# them at runtime via environment substitution if your service names differ.
#
# Usage with docker-compose.scale.yml:
#   docker compose -f docker-compose.scale.yml up --scale msgworker=2 -d
#   SDK connects to ws://localhost:18000/ws and http://localhost:18000

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format optimized for IM traffic analysis.
    log_format im '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time" '
                  'us="$upstream_status" ua="$upstream_addr"';

    access_log /var/log/nginx/access.log im;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Keep-alive and timeout tuning for long-lived WebSocket connections.
    keepalive_timeout           300s;
    keepalive_requests          10000;
    client_body_timeout         60s;
    client_header_timeout       60s;
    send_timeout                60s;

    # WebSocket upstream: ip_hash keeps a client on the same gateway node.
    # This improves server-side session routing cache hit rates.
    upstream websocket_backend {
        ip_hash;
        server gateway-1:8000 weight=1 max_fails=3 fail_timeout=10s;
        server gateway-2:8000 weight=1 max_fails=3 fail_timeout=10s;
        # Add more gateway-N entries as you scale horizontally.
        keepalive 32;
    }

    # HTTP API upstream: least-connections spreads REST/gRPC-web load.
    upstream http_backend {
        least_conn;
        server gateway-1:8000 weight=1 max_fails=3 fail_timeout=10s;
        server gateway-2:8000 weight=1 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket endpoint
        location /ws {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for bidirectional real-time traffic.
            proxy_buffering off;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_connect_timeout 5s;
        }

        # REST / gRPC-web HTTP API endpoint
        location / {
            proxy_pass http://http_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 5s;
        }

        # Health check endpoint for load balancers / orchestrators.
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
