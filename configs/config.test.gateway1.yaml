server:
  http:
    addr: 0.0.0.0:18000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:19000
    timeout: 1s
data:
  database:
    driver: postgres
    source: host=127.0.0.1 user=postgres password=root dbname=nonoka_im_test port=5433
      sslmode=disable TimeZone=Asia/Shanghai
    max_open_conns: 200
    max_idle_conns: 50
    conn_max_lifetime: 1800s
  redis:
    addr: 127.0.0.1:6380
    read_timeout: 0.2s
    write_timeout: 0.2s
  mongodb:
    uri: mongodb://127.0.0.1:27018
    database: nonoka_im_test
    write_concern: w1
  kafka:
    brokers:
    - 127.0.0.1:9092
    topic: im-messages
    consumer_group: msgworker-group
    batch_size: 1000
    batch_timeout: 0.01s
    compression: lz4
    required_acks: one
    async: true
    max_attempts: 3
    write_timeout: 10s
    read_timeout: 10s
    worker_count: 0
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 0.05s
    commit_interval: 0s
    max_retries: 3
    commit_batch_size: 20
    commit_flush_interval: 1s
dispatch:
  gateways:
  - node_id: gateway-1
    gateway_url: ws://127.0.0.1:18000/ws
    gateway_grpc_addr: 127.0.0.1:19000
  - node_id: gateway-2
    gateway_url: ws://127.0.0.1:18002/ws
    gateway_grpc_addr: 127.0.0.1:19002
  strategy: consistent_hash
  heartbeat_interval: 10s
  node_ttl: 30s
gateway:
  heartbeat_interval: 30s
  heartbeat_timeout: 90s
  read_timeout: 60s
  write_timeout: 10s
  allowed_origins: []
  cors_origins:
    - http://localhost:3000
auth:
  jwt_secret: test-jwt-secret-do-not-use-in-production
  token_ttl: 3600s
msgworker:
  session_cache_ttl: 5s
  receipt_batch_size: 32
  receipt_batch_timeout: 0.01s
  group_batch_size: 16
  group_batch_timeout: 0.005s
