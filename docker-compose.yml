services:
  postgres:
    image: postgres:15-alpine
    container_name: nonoka_postgres
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: nonoka
      POSTGRES_PASSWORD: nonoka
      POSTGRES_DB: nonoka
    ports:
      - "${NONOKA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonoka -d nonoka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nonoka_redis
    ports:
      - "${NONOKA_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: nonoka_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongodb:27017''}]}).ok }" | grep -q 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    container_name: nonoka_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${NONOKA_MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: nonoka_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${NONOKA_JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${NONOKA_JAEGER_OTLP_PORT:-4318}:4318"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nonoka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nonoka_kafka
    # ZooKeeper may still be initialising on first boot; restart absorbs the race.
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 5s
      timeout: 10s
      retries: 10

  # OpenFGA stores authorization tuples in its own PostgreSQL database. The
  # backend auto-bootstraps the local `nonoka-im` store/model when the stack
  # starts; production deployments should pin the generated IDs instead.
  openfga-postgres:
    image: postgres:15-alpine
    container_name: nonoka_openfga_postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
      TZ: Asia/Shanghai
    volumes:
      - openfga_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.8.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-postgres:5432/openfga?sslmode=disable
    depends_on:
      openfga-postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.8.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-postgres:5432/openfga?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: nonoka-openfga-dev-key
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # Bifrost owns provider keys, model routing, budgets and the OpenAI-compatible
  # inference endpoint. ModelService rows only reference a Bifrost virtual key.
  bifrost:
    image: maximhq/bifrost:v2.4.0
    container_name: nonoka_bifrost
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-nonoka-bifrost-encryption-key-32b}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-nonoka-bifrost-admin}
    ports:
      - "127.0.0.1:${NONOKA_BIFROST_PORT:-8088}:8080"
    volumes:
      - ./configs/bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nonoka-im:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonoka_im
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      openfga:
        condition: service_started
    environment:
      GATEWAY_WS_ADDR: ws://127.0.0.1:${NONOKA_HTTP_PORT:-8000}/ws
      GATEWAY_GRPC_ADDR: nonoka-im:9002
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      # This must match the agent worker so bot send tokens are accepted.
      AGENT_WORKER_JWT_SECRET: ${AGENT_WORKER_JWT_SECRET:-nonoka-local-agent-worker-jwt-secret-change-me}
      # Encrypts per-agent model API keys at rest; must match the agent worker.
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      INTERNAL_PUSH_TOKEN: ${INTERNAL_PUSH_TOKEN:-nonoka-local-internal-push-token}
      # Platform admins (OpenFGA platform:global admin), bootstrapped at start.
      AGENT_ADMIN_USER_IDS: ${AGENT_ADMIN_USER_IDS:-}
      BIFROST_URL: http://bifrost:8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-nonoka-bifrost-admin}
      BIFROST_AGENT_MONTHLY_BUDGET_USD: ${BIFROST_AGENT_MONTHLY_BUDGET_USD:-20}
      BIFROST_GLOBAL_MONTHLY_BUDGET_USD: ${BIFROST_GLOBAL_MONTHLY_BUDGET_USD:-200}
      BIFROST_AGENT_REQUEST_PER_MINUTE: ${BIFROST_AGENT_REQUEST_PER_MINUTE:-60}
      BIFROST_AGENT_TOKENS_PER_MINUTE: ${BIFROST_AGENT_TOKENS_PER_MINUTE:-200000}
      AGENT_QUOTA_TIMEZONE: ${AGENT_QUOTA_TIMEZONE:-Asia/Shanghai}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-}
      AGENT_MCP_ALLOW_PRIVATE: ${AGENT_MCP_ALLOW_PRIVATE:-false}
      AGENT_MCP_ALLOW_INSECURE_HTTP: ${AGENT_MCP_ALLOW_INSECURE_HTTP:-false}
      BOT_WEBHOOK_ALLOW_PRIVATE: ${BOT_WEBHOOK_ALLOW_PRIVATE:-true}
      BOT_WEBHOOK_ALLOW_INSECURE_HTTP: ${BOT_WEBHOOK_ALLOW_INSECURE_HTTP:-true}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      AGENT_OUTBOX_ALERT_WEBHOOK: ${AGENT_OUTBOX_ALERT_WEBHOOK:-}
      AGENT_OUTBOX_ALERT_MIN_INTERVAL: ${AGENT_OUTBOX_ALERT_MIN_INTERVAL:-15m}
      AGENT_OUTBOX_ALERT_MAX_AGE: ${AGENT_OUTBOX_ALERT_MAX_AGE:-5m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NONOKA_HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${NONOKA_GRPC_PORT:-9002}:9002"
    volumes:
      - ./configs:/data/conf:ro
    command: ["/app/nonoka-im", "-conf", "/data/conf/config.docker.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/metrics > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  msgworker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonoka_msgworker
    depends_on:
      nonoka-im:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./configs:/data/conf:ro
    environment:
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      AGENT_OUTBOX_ALERT_WEBHOOK: ${AGENT_OUTBOX_ALERT_WEBHOOK:-}
      AGENT_OUTBOX_ALERT_MIN_INTERVAL: ${AGENT_OUTBOX_ALERT_MIN_INTERVAL:-15m}
      AGENT_OUTBOX_ALERT_MAX_AGE: ${AGENT_OUTBOX_ALERT_MAX_AGE:-5m}
    command: ["/app/msgworker", "-conf", "/data/conf/config.docker.yaml"]

  # Agent worker runs as part of the full demo stack. Agents without their own
  # API key fall back to DEEPSEEK_API_KEY; without either they cannot run.
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonoka_agent_worker
    restart: unless-stopped
    depends_on:
      nonoka-im:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      openfga:
        condition: service_started
      bifrost:
        condition: service_healthy
    environment:
      POSTGRES_DSN: host=postgres user=nonoka password=nonoka dbname=nonoka port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DATABASE: nonoka_im
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      IM_HTTP_URL: http://nonoka-im:8000
      GATEWAY_GRPC_ADDR: nonoka-im:9002
      INTERNAL_PUSH_TOKEN: ${INTERNAL_PUSH_TOKEN:-nonoka-local-internal-push-token}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BIFROST_URL: http://bifrost:8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-nonoka-bifrost-admin}
      BIFROST_AUTO_PROVISION: ${BIFROST_AUTO_PROVISION:-true}
      BIFROST_DEFAULT_MODEL: ${BIFROST_DEFAULT_MODEL:-deepseek/deepseek-flash}
      BIFROST_AGENT_MONTHLY_BUDGET_USD: ${BIFROST_AGENT_MONTHLY_BUDGET_USD:-20}
      BIFROST_GLOBAL_MONTHLY_BUDGET_USD: ${BIFROST_GLOBAL_MONTHLY_BUDGET_USD:-200}
      BIFROST_AGENT_REQUEST_PER_MINUTE: ${BIFROST_AGENT_REQUEST_PER_MINUTE:-60}
      BIFROST_AGENT_TOKENS_PER_MINUTE: ${BIFROST_AGENT_TOKENS_PER_MINUTE:-200000}
      AGENT_QUOTA_TIMEZONE: ${AGENT_QUOTA_TIMEZONE:-Asia/Shanghai}
      AGENT_USER_MAX_CONCURRENT_RUNS: ${AGENT_USER_MAX_CONCURRENT_RUNS:-2}
      AGENT_USER_DAILY_RUNS: ${AGENT_USER_DAILY_RUNS:-200}
      AGENT_USER_DAILY_TOKENS: ${AGENT_USER_DAILY_TOKENS:-2000000}
      AGENT_USER_DAILY_COST_USD: ${AGENT_USER_DAILY_COST_USD:-5}
      AGENT_USER_MAX_TOOL_TURNS: ${AGENT_USER_MAX_TOOL_TURNS:-8}
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-4}
      AGENT_DAILY_RUNS: ${AGENT_DAILY_RUNS:-500}
      AGENT_DAILY_TOKENS: ${AGENT_DAILY_TOKENS:-5000000}
      AGENT_DAILY_COST_USD: ${AGENT_DAILY_COST_USD:-10}
      AGENT_MAX_TOOL_TURNS: ${AGENT_MAX_TOOL_TURNS:-8}
      AGENT_MAX_SESSION_QUEUED: ${AGENT_MAX_SESSION_QUEUED:-3}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-}
      AGENT_MCP_ALLOW_PRIVATE: ${AGENT_MCP_ALLOW_PRIVATE:-false}
      AGENT_MCP_ALLOW_INSECURE_HTTP: ${AGENT_MCP_ALLOW_INSECURE_HTTP:-false}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      AGENT_WORKER_JWT_SECRET: ${AGENT_WORKER_JWT_SECRET:-nonoka-local-agent-worker-jwt-secret-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      AGENT_EVENTS_TOPIC: ${AGENT_EVENTS_TOPIC:-agent-events}
      AGENT_EVENTS_GROUP: ${AGENT_EVENTS_GROUP:-nonoka-agent-worker}
      AGENT_WORKERS: ${AGENT_WORKERS:-2}
      AGENT_RUN_WORKERS: ${AGENT_RUN_WORKERS:-8}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-2}
      # Optional in-process probes; the healthcheck uses /healthz via busybox wget.
      AGENT_HEALTH_ADDR: ${AGENT_HEALTH_ADDR:-:8090}
      AGENT_METRICS_ADDR: ${AGENT_METRICS_ADDR:-:8091}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/app/agent-worker", "-conf", "/app/configs/agent-worker.yaml"]
    volumes:
      - ./configs/agent-worker.yaml:/app/configs/agent-worker.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  bot-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonoka_bot_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      openfga:
        condition: service_started
    environment:
      POSTGRES_DSN: host=postgres user=nonoka password=nonoka dbname=nonoka port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DATABASE: nonoka_im
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      BOT_SECRET_KEY: ${BOT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      BOT_WEBHOOK_ALLOW_PRIVATE: ${BOT_WEBHOOK_ALLOW_PRIVATE:-true}
      BOT_WEBHOOK_ALLOW_INSECURE_HTTP: ${BOT_WEBHOOK_ALLOW_INSECURE_HTTP:-true}
      BOT_DELIVERY_WORKERS: ${BOT_DELIVERY_WORKERS:-8}
      BOT_PROBE_ADDR: ${BOT_PROBE_ADDR:-:8092}
      BOT_METRICS_ADDR: ${BOT_METRICS_ADDR:-:8093}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/app/bot-worker", "-conf", "/app/configs/bot-worker.yaml"]
    volumes:
      - ./configs/bot-worker.yaml:/app/configs/bot-worker.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./web/app
      args:
        # Browser-side calls go to the host-mapped backend port.
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${NONOKA_HTTP_PORT:-8000}
        NEXT_PUBLIC_TRACE_URL_TEMPLATE: ${NEXT_PUBLIC_TRACE_URL_TEMPLATE:-http://127.0.0.1:16686/trace/{traceId}}
    container_name: nonoka_web
    depends_on:
      nonoka-im:
        condition: service_healthy
    ports:
      - "${NONOKA_WEB_PORT:-3001}:3000"

volumes:
  postgres_data:
  mongodb_data:
  openfga_data:
  bifrost_data:
  meilisearch_data:
