services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [nonoka]
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:19092"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks: [nonoka]
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    environment: {POSTGRES_USER: nonoka, POSTGRES_PASSWORD: nonoka, POSTGRES_DB: nonoka}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonoka -d nonoka"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nonoka]
  redis:
    image: redis:7-alpine
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nonoka]
  # Three-node replica set. Writes still go to the primary, but the deployment
  # survives a primary failure and reads can be moved to secondaries later.
  mongo-1:
    image: mongo:7
    hostname: mongo-1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo1_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nonoka]
  mongo-2:
    image: mongo:7
    hostname: mongo-2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo2_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nonoka]
  mongo-3:
    image: mongo:7
    hostname: mongo-3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo3_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nonoka]
  mongo-init:
    image: mongo:7
    depends_on:
      mongo-1: {condition: service_healthy}
      mongo-2: {condition: service_healthy}
      mongo-3: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mongosh --host mongo-1 --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
        mongosh --host mongo-1 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                {_id: 0, host: "mongo-1:27017"},
                {_id: 1, host: "mongo-2:27017"},
                {_id: 2, host: "mongo-3:27017"}
              ]
            })
          }'
        until mongosh --host mongo-1 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
    networks: [nonoka]
  openfga-postgres:
    image: postgres:15-alpine
    hostname: openfga-postgres
    environment: {POSTGRES_USER: openfga, POSTGRES_PASSWORD: openfga, POSTGRES_DB: openfga}
    volumes: [openfga_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nonoka]
  openfga-migrate:
    image: openfga/openfga:v1.8.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-postgres:5432/openfga?sslmode=disable
    depends_on:
      openfga-postgres: {condition: service_healthy}
    networks: [nonoka]
  openfga:
    image: openfga/openfga:v1.8.0
    hostname: openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-postgres:5432/openfga?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: nonoka-openfga-dev-key
    depends_on:
      openfga-migrate: {condition: service_completed_successfully}
    networks: [nonoka]
  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    hostname: meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilisearch_data:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nonoka]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    hostname: jaeger
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    networks: [nonoka]
  bifrost:
    image: maximhq/bifrost:v2.4.0
    hostname: bifrost
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-nonoka-bifrost-encryption-key-32b}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - ./configs/bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nonoka]
  gateway-1:
    build: {context: ., dockerfile: Dockerfile}
    hostname: gateway-1
    environment:
      GATEWAY_NODE_ID: gateway-1
      GATEWAY_WS_ADDR: ws://127.0.0.1:8001/ws
      GATEWAY_GRPC_ADDR: gateway-1:9002
      METRICS_ADDR: 0.0.0.0:9001
      # Must match the agent worker so bot send tokens are accepted.
      AGENT_WORKER_JWT_SECRET: ${AGENT_WORKER_JWT_SECRET:-nonoka-local-agent-worker-jwt-secret-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      INTERNAL_PUSH_TOKEN: ${INTERNAL_PUSH_TOKEN:-nonoka-local-internal-push-token}
      BIFROST_URL: http://bifrost:8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      AGENT_ADMIN_USER_IDS: ${AGENT_ADMIN_USER_IDS:-}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      BOT_WEBHOOK_ALLOW_PRIVATE: ${BOT_WEBHOOK_ALLOW_PRIVATE:-true}
      BOT_WEBHOOK_ALLOW_INSECURE_HTTP: ${BOT_WEBHOOK_ALLOW_INSECURE_HTTP:-true}
    ports: ["8001:8000"]
    command: ["/app/nonoka-im", "-conf", "/data/conf/config.scale.yaml", "-node-id", "gateway-1"]
    volumes: [./configs:/data/conf:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      openfga: {condition: service_started}
    networks: [nonoka]
  gateway-2:
    build: {context: ., dockerfile: Dockerfile}
    hostname: gateway-2
    environment:
      GATEWAY_NODE_ID: gateway-2
      GATEWAY_WS_ADDR: ws://127.0.0.1:8002/ws
      GATEWAY_GRPC_ADDR: gateway-2:9002
      METRICS_ADDR: 0.0.0.0:9001
      # Must match the agent worker so bot send tokens are accepted.
      AGENT_WORKER_JWT_SECRET: ${AGENT_WORKER_JWT_SECRET:-nonoka-local-agent-worker-jwt-secret-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      INTERNAL_PUSH_TOKEN: ${INTERNAL_PUSH_TOKEN:-nonoka-local-internal-push-token}
      BIFROST_URL: http://bifrost:8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      AGENT_ADMIN_USER_IDS: ${AGENT_ADMIN_USER_IDS:-}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      BOT_WEBHOOK_ALLOW_PRIVATE: ${BOT_WEBHOOK_ALLOW_PRIVATE:-true}
      BOT_WEBHOOK_ALLOW_INSECURE_HTTP: ${BOT_WEBHOOK_ALLOW_INSECURE_HTTP:-true}
    ports: ["8002:8000"]
    command: ["/app/nonoka-im", "-conf", "/data/conf/config.scale.yaml", "-node-id", "gateway-2"]
    volumes: [./configs:/data/conf:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      openfga: {condition: service_started}
    networks: [nonoka]
  msgworker:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      METRICS_ADDR: 0.0.0.0:9001
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
    command: ["/app/msgworker", "-conf", "/data/conf/config.scale.yaml"]
    volumes: [./configs:/data/conf:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      gateway-1: {condition: service_started}
      gateway-2: {condition: service_started}
    networks: [nonoka]
  # Single agent worker in the scale demo; replies go through the nginx LB so
  # they hit whichever gateway holds the bot's send path. Stays idle when no
  # model API key is configured.
  agent-worker:
    build: {context: ., dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      POSTGRES_DSN: host=postgres user=nonoka password=nonoka dbname=nonoka port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MONGODB_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/?replicaSet=rs0
      MONGODB_DATABASE: nonoka_im
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      IM_HTTP_URL: http://nginx
      GATEWAY_GRPC_ADDR: gateway-1:9002,gateway-2:9002
      INTERNAL_PUSH_TOKEN: ${INTERNAL_PUSH_TOKEN:-nonoka-local-internal-push-token}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BIFROST_URL: http://bifrost:8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-nonoka-bifrost-setup-token}
      BIFROST_AUTO_PROVISION: ${BIFROST_AUTO_PROVISION:-true}
      BIFROST_DEFAULT_MODEL: ${BIFROST_DEFAULT_MODEL:-deepseek/deepseek-flash}
      AGENT_WORKER_JWT_SECRET: ${AGENT_WORKER_JWT_SECRET:-nonoka-local-agent-worker-jwt-secret-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      AGENT_EVENTS_TOPIC: ${AGENT_EVENTS_TOPIC:-agent-events}
      AGENT_EVENTS_GROUP: ${AGENT_EVENTS_GROUP:-nonoka-agent-worker}
      AGENT_WORKERS: ${AGENT_WORKERS:-2}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-2}
      # Optional in-process probes; the healthcheck uses /healthz via busybox wget.
      AGENT_HEALTH_ADDR: ${AGENT_HEALTH_ADDR:-:8090}
      AGENT_METRICS_ADDR: ${AGENT_METRICS_ADDR:-:8091}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nonoka-local-search-key}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-mongo}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    command: ["/app/agent-worker", "-conf", "/app/configs/agent-worker.yaml"]
    volumes:
      - ./configs/agent-worker.yaml:/app/configs/agent-worker.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      nginx: {condition: service_started}
      postgres: {condition: service_healthy}
      mongo-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      redis: {condition: service_started}
      openfga: {condition: service_started}
      bifrost: {condition: service_healthy}
    networks: [nonoka]
  bot-worker:
    build: {context: ., dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      POSTGRES_DSN: host=postgres user=nonoka password=nonoka dbname=nonoka port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MONGODB_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/?replicaSet=rs0
      MONGODB_DATABASE: nonoka_im
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:19092
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_AUTO_BOOTSTRAP: ${OPENFGA_AUTO_BOOTSTRAP:-true}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-nonoka-openfga-dev-key}
      BOT_SECRET_KEY: ${BOT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-nonoka-local-agent-secret-key-change-me}
      BOT_WEBHOOK_ALLOW_PRIVATE: ${BOT_WEBHOOK_ALLOW_PRIVATE:-true}
      BOT_WEBHOOK_ALLOW_INSECURE_HTTP: ${BOT_WEBHOOK_ALLOW_INSECURE_HTTP:-true}
      BOT_DELIVERY_WORKERS: ${BOT_DELIVERY_WORKERS:-8}
      BOT_PROBE_ADDR: ${BOT_PROBE_ADDR:-:8092}
      BOT_METRICS_ADDR: ${BOT_METRICS_ADDR:-:8093}
    command: ["/app/bot-worker", "-conf", "/app/configs/bot-worker.yaml"]
    volumes:
      - ./configs/bot-worker.yaml:/app/configs/bot-worker.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      openfga: {condition: service_started}
    networks: [nonoka]
  nginx:
    image: nginx:alpine
    ports: ["18000:80"]
    volumes: [./configs/nginx-scale.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [gateway-1, gateway-2]
    networks: [nonoka]
  web:
    build:
      context: ./web/app
      args:
        # Browser-side calls go through the nginx gateway LB.
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
    ports: ["3001:3000"]
    depends_on: [nginx]
    networks: [nonoka]
volumes:
  postgres_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  openfga_data:
  bifrost_data:
  meilisearch_data:
networks:
  nonoka:
    driver: bridge
